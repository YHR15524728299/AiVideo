provider: dreamina
command_prefix:
- dreamina
image_command:
- text2image
- --prompt
- '{prompt}'
- --ratio
- '{ratio}'
- --model_version
- '{model}'
- --poll
- '0'
video_command:
- text2video
- --prompt
- '{prompt}'
- --duration
- '{duration}'
- --ratio
- '{ratio}'
- --model_version
- '{model}'
- --poll
- '0'
status_command:
- query_result
- --submit_id
- '{submit_id}'
wait_command: []
download_command:
- query_result
- --submit_id
- '{submit_id}'
- --download_dir
- '{download_dir}'
validate_command: []
video:
  default_duration_seconds: 5
  hard_min_duration_seconds: 4
  hard_max_duration_seconds: 15
  detected_supported_durations:
  - 4.0
  - 5.0
  - 6.0
  - 7.0
  - 8.0
  - 9.0
  - 10.0
  - 11.0
  - 12.0
  - 13.0
  - 14.0
  - 15.0
  supports_reference_image: false
  supports_first_frame: false
  supports_last_frame: false
  supports_async_task: true
execution:
  timeout_seconds: 1800
  poll_interval_seconds: 2
  max_concurrency: 1
  retry_count: 1
  cache_enabled: true
detection:
  status: detected
  checked_at: '2026-07-21'
  source: dreamina --help; text2image --help; text2video --help; query_result --help
  note: Dreamina 1.4.11 异步协议：提交、query_result 轮询、download_dir 下载。
