[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-content-factory"
version = "0.1.0"
description = "方向驱动 AI 自动成片系统（M0-M2）"
# kokoro-onnx does not currently publish builds for Python 3.14.
requires-python = ">=3.11,<3.14"
dependencies = [
  "edge-tts>=7.0,<8",
  "Pillow>=10.4,<12",
  "pydantic>=2.7,<3",
  "PyYAML>=6.0,<7",
  "python-dotenv>=1.0,<2",
  "kokoro-onnx>=0.5.0",
  "misaki[zh]>=0.5.0",
  "soundfile>=0.14.0",
]

[project.optional-dependencies]
asr = [
  "faster-whisper>=1.1,<2",
]
dev = [
  "pytest>=8.2,<9",
  "pytest-cov>=5,<6",
]

[project.scripts]
aicf = "aicf.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.coverage.run]
source = ["aicf"]

[tool.coverage.report]
show_missing = true
fail_under = 80
